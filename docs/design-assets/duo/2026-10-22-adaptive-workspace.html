lur(18px)}#settings[hidden]{display:none}.handle{height:4px;width:32px;border-radius:5px;background:#ffffff55;margin:0 auto 12px}#settings .readings{display:flex;justify-content:space-around;font-size:12px;margin:12px 0}#settings .handle+.readings{height:48px;background:#ffffff12;border-radius:12px;align-items:center;margin:0 0 12px}.adjustments{display:flex;gap:6px;margin-top:12px}.adjustments button{padding:8px 2px;border:0;background:none;font-size:12px;min-height:44px;flex:1}.rail,.fold{display:none}.device.outer{max-width:460px;height:640px}.outer .canvas{right:100px;bottom:92px}.outer .top{right:90px}.outer .tools{left:auto;right:0;width:64px;height:194px;flex-direction:column}.outer .timeline,.outer .controls>.readings{width:auto;right:82px}.outer #settings{left:0;right:82px;bottom:64px}.outer .transport,.outer.panel-open .transport{left:calc((100% - 82px)/2 - 75px);bottom:110px}.outer.panel-open .transport{bottom:300px}.device.portrait{max-width:440px;height:710px}.portrait .canvas{bottom:240px}.portrait .tools{left:0;right:0}.portrait .timeline,.portrait .controls>.readings{width:100%;right:0}.portrait .timeline{bottom:78px}.portrait .controls>.readings{bottom:122px}.portrait .transport{left:calc(50% - 75px);bottom:205px}.portrait #settings{left:0;right:0;bottom:118px}.portrait.panel-open .transport{left:calc(50% - 75px);bottom:290px}.caption{max-width:960px;margin:20px auto}.note{font-size:12px;color:#939ba7}.viewport{overflow-x:auto;padding-bottom:4px}@media(max-width:650px){body{padding:16px}.device.flat,.device.book{min-width:590px}.device.outer,.device.portrait{min-width:330px}}

<h1>视频始终是主角。</h1><p>直拍鸭 · iPhone Duo 自适应工作台提案<br>保留当前面板内容与顺序，按用户草图适配：外屏右侧工具，内屏横向底部左右分区，内屏竖向底部上下排列。</p><nav aria-label="布局示意"><button data-mode="outer">外屏</button><button data-mode="flat" aria-pressed="true">内屏横向</button><button data-mode="book">书本展开</button><button data-mode="portrait">内屏竖向</button></nav><div class="viewport"><main class="device flat" id="device"><section class="canvas" aria-label="纯几何模拟人物"><svg class="figure" viewBox="0 0 120 300" role="img" aria-label="绘制的模拟舞者"><circle cx="60" cy="30" r="23" fill="#edc2a1"/><path d="M45 65 Q60 55 75 65 L91 154 29 154Z" fill="#e4bf59"/><path d="M43 80 L12 130 M77 80 L108 110 M48 155 L33 265 M72 155 L95 265" fill="none" stroke="#c6ccd8" stroke-width="20" stroke-linecap="round"/></svg><span class="tag" style="position:absolute;top:18px;left:18px">预览 · 模拟素材</span></section><section class="controls"><div class="top"><span>‹ 项目</span><strong>预览</strong><span class="tag">导出 ↗</span></div><div class="transport">↶ &nbsp; ▶ &nbsp; ↷</div><div class="readings"><span>00:12 / 00:36</span><span>16:9</span></div><div class="timeline" aria-label="时间轴示意"></div><div class="tools"><button aria-pressed="false">构图</button><button>运镜</button><button>打码</button></div><div id="settings" hidden><div class="handle"></div><div class="readings"><span>16:9</span><span>4:3</span><span>1:1</span></div><div class="readings"><span>占比 60%</span><span>左右 0%</span><span>上下 0%</span></div><div class="adjustments"><button aria-label="缩小">−</button><button aria-label="放大">＋</button><button>水平居中</button><button>垂直居中</button></div></div></section><div class="fold"></div><aside class="rail" aria-label="系统侧栏位置示意"><span>‹</span><span>↗</span><span>•••</span></aside></main></div><p class="caption" id="caption">展开：工具横向固定在底部，与时间轴保持普通 iPhone 的顺序；面板向上浮动，展开时仍显示时间轴。</p><p class="caption note">概念示意，比例与安全区非设备实测。条纹仅表示折叠保留区域；实际由系统 API 决定位置与范围。按钮用于切换布局，参数为静态示意，不代表真实编辑器。</p><script>
const device=document.getElementById('device'),panel=document.getElementById('settings');
const captions={outer:'外屏：右侧竖向工具；进度条位于视频下方，面板覆盖视频下部并保留进度条。',flat:'内屏横向：左下进度条、右下横向工具；面板在右下工具上方浮动，播放控件移向左侧。',book:'书本展开：与内屏横向保持一致，左下进度条、右下工具，面板在工具上方浮动。',portrait:'内屏竖向：上方视频，底部依次为进度条和横向工具；面板浮在工具上方，播放控件在展开时移入视频。'};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{device.className='device '+b.dataset.mode+(panel.hidden?'':' panel-open');document.getElementById('caption').textContent=captions[b.dataset.mode];document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
document.querySelectorAll('.tools button').forEach(b=>b.onclick=()=>{if(b.textContent!=='构图')return;panel.hidden=!panel.hidden;b.setAttribute('aria-pressed',String(!panel.hidden));device.classList.toggle('panel-open',!panel.hidden)});
document.getElementById('caption').textContent=captions.flat;
</script></html>
